version: '3.8'

services:
  cuda-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: hf3dneuralreco:latest
    container_name: hf3dneuralreco-dev
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_HOME=/usr/local/cuda-11.8
    volumes:
      - ./:/workspace
      - ~/.cache:/home/developer/.cache  # Cache pip/torch downloads
    working_dir: /workspace
    stdin_open: true
    tty: true
    shm_size: '8gb'  # Increase shared memory for PyTorch DataLoader
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
