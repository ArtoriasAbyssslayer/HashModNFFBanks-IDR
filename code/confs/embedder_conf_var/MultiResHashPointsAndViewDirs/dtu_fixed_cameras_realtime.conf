train{
    expname = dtu_fixed_cameras_realtime
    exps_folder_name = ./exps  # Required for IDRTrainRunner
    dataset_class = datasets.scene_dataset.SceneDataset
    model_class = model.implicit_differentiable_renderer.IDRNetwork
    loss_class = model.loss.IDRLoss
    learning_rate = 1.0e-4
    learning_rate_cam = 1.0e-4
    num_pixels = 2048
    batch_size = 1  # Required for IDRTrainRunner
    plot_freq = 10  # More frequent updates for real-time rendering
    alpha_milestones = [250,500,750,1000,1250]
    alpha_factor = 2
    sched_milestones = [1000,1500]
    sched_factor = 0.5
    nepochs = 2000  # Default number of epochs
}
plot{
    plot_nimgs = 1
    max_depth = 3.0
    resolution = 100
}
loss{
    eikonal_weight = 0.1
    mask_weight = 100.0
    alpha = 50.0
}
dataset{
    data_dir = DTU
    img_res = [1200, 1600]
    scan_id = 65
}
model{
    feature_vector_size = 256
    implicit_network
    {
        d_in = 3
        d_out = 1
        dims = [512, 512, 512, 512]
        geometric_init = True
        bias = 0.6
        skip_in = [3]
        weight_norm = True
        multires = 6
    }
    rendering_network
    {
        mode = idr
        d_in = 9
        d_out = 3
        dims = [ 512, 512, 512, 512]
        weight_norm = True
        multires_view = 4
    }
    ray_tracer
    {
        object_bounding_sphere = 1.0
        sdf_threshold = 5.0e-5
        line_search_step = 0.5
        line_step_iters = 3
        sphere_tracing_iters = 10
        n_steps = 100
        n_secant_steps = 8
    }
    embedding_network {
        embed_type = HashGrid
        log2_max_hash_size = 19
        max_points_per_entry = 2
        base_resolution = 16
        desired_resolution = 512
        bound = 1.0
    }
}
# Real-time rendering configuration
realtime_render {
    enabled = true
    target_fps = 60
    base_resolution = 512
    max_resolution = 1024
    adaptive_quality = true
    lod_levels = 4
    occupancy_grid_resolution = 128
    
    camera {
        movement_speed = 2.0
        mouse_sensitivity = 0.002
        fov = 60.0
        near_plane = 0.1
        far_plane = 100.0
        mode = "fps"  # fps, orbit, turn_table
    }
    
    performance {
        memory_pool_size_mb = 2048
        max_split_size_mb = 128
        enable_streaming = true
        render_priority = 1
        train_priority = 0
        adaptive_memory_management = true
    }
    
    quality {
        initial_quality = 1.0
        min_quality = 0.25
        max_quality = 1.5
        adaptation_speed = 0.1
        motion_threshold = 0.01
        adaptation_interval = 0.5
    }
    
    rendering {
        enable_depth = true
        enable_normals = true
        enable_sdf_isosurface = false
        enable_ambient_occlusion = true
        enable_shadows = false
        enable_reflections = false
        
        ray_samples = 2048
        min_ray_samples = 256
        max_ray_samples = 4096
        sphere_tracing_steps_min = 5
        sphere_tracing_steps_max = 20
        secant_steps_min = 4
        secant_steps_max = 16
        
        texture_format = "rgba32f"  # rgba32f, rgba8
        double_buffering = true
        vsync = false
    }
    
    optimization {
        occupancy_grid {
            enabled = true
            resolution = 128
            threshold = 0.01
            adaptive = true
            initial_resolution = 64
            max_resolution = 256
            update_frequency = 50
        }
        
        lod {
            enabled = true
            num_levels = 5
            base_quality = 0.25
            quality_multiplier = 1.5
            transition_speed = 0.1
        }
        
        memory {
            cache_clearing_mode = "smart"  # smart, disabled, aggressive
            max_fragmentation = 0.3
            cleanup_interval = 30.0
            gc_threshold = 0.8
        }
    }
    
    debug {
        show_performance_overlay = true
        show_memory_usage = true
        show_occupancy_grid = false
        show_bounding_boxes = false
        log_performance = false
        performance_log_interval = 100
    }
}